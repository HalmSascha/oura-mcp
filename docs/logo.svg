<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="oura-mcp logo">
  <title>oura-mcp</title>
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5B8DEF"/>
      <stop offset="55%" stop-color="#7C6CF0"/>
      <stop offset="100%" stop-color="#4ECDC4"/>
    </linearGradient>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4ECDC4"/>
      <stop offset="100%" stop-color="#9BE7E1"/>
    </linearGradient>
    <mask id="cut">
      <rect width="128" height="128" fill="#fff"/>
      <rect x="18" y="55" width="92" height="18" rx="9" fill="#000"/>
    </mask>
  </defs>

  <!-- Outer band: the wearable. Deliberately an open band, not a closed
       torus, so it reads as its own mark rather than a product logo. -->
  <g mask="url(#cut)">
    <circle cx="64" cy="64" r="42" fill="none" stroke="url(#ring)" stroke-width="13"/>
  </g>

  <!-- Inner trace: a night of data crossing the band. Four beats then a
       settling tail, which is roughly what a good night looks like. -->
  <path d="M14 64 L30 64 L37 48 L45 80 L53 54 L61 74 L69 58 L78 68 L86 64 L114 64"
        fill="none" stroke="url(#trace)" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
