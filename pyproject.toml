[project]
name = "oura-mcp"
version = "0.1.0"
description = "MCP server for Oura Ring data: sleep, readiness, activity, workouts, HRV"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Sascha Halm" }]
keywords = ["mcp", "model-context-protocol", "oura", "oura-ring", "health", "hrv", "sleep"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "mcp>=2.0,<3",
    "httpx>=0.27",
    "uvicorn>=0.30",
    "starlette>=0.37",
]

[project.urls]
Homepage = "https://github.com/HalmSascha/oura-mcp"
Repository = "https://github.com/HalmSascha/oura-mcp"
Issues = "https://github.com/HalmSascha/oura-mcp/issues"

[project.scripts]
oura-mcp = "oura_mcp.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "respx>=0.21", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oura_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 95
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately reach into private helpers to pin down internal contracts.
"tests/*" = ["SLF001"]
